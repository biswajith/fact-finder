[project]
name = "fact-extractor"
version = "0.1.0"
description = "RFP fact extraction harness: tagged whole-document prompts, parallel calls, ID citations"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.60",
]

[project.scripts]
fact-extractor = "fact_extractor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_extractor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
