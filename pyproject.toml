[project]
name = "fact-extractor"
version = "0.1.0"
description = "RFP fact extraction harness: tagged whole-document prompts, parallel calls, ID citations"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.60",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# Chat workspace web UI (fact-extractor web).
# langchain-openai: the Decisions API client that picks the chat planning mode (web/planning.py).
web = ["fastapi>=0.115", "uvicorn>=0.30", "langchain-openai>=1.7.2"]
# goldset (src/goldset) runtime dependencies plus the DeepEval suite.
evals = [
    "jmespath>=1.1.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
    "deepeval>=4.3.4",
]

[project.scripts]
fact-extractor = "fact_extractor.cli:main"
goldset = "goldset.cli:main"

[dependency-groups]
dev = [
    "fact-extractor[evals,web]",
    "httpx>=0.27",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_extractor", "src/goldset"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src/goldset", "tests/goldset_builder"]
venvPath = "."
venv = ".venv"
